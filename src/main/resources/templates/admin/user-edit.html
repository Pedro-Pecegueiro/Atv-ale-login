<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Editar usuario')}"></head>
<body>
<header th:replace="~{fragments/layout :: navigation}"></header>
<main class="auth-shell container">
    <section class="auth-card">
        <span class="eyebrow">Administracao</span>
        <h1>Editar <span th:text="${user.username}">usuario</span></h1>
        <p class="muted" th:text="${user.email}">email</p>
        <form th:action="@{/admin/usuarios/{id}(id=${user.id})}" th:object="${adminUserUpdateForm}" method="post" class="stacked-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-error"><p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p></div>
            <fieldset>
                <legend>Perfis autorizados</legend>
                <label class="check-row" th:each="role : ${allRoles}">
                    <input type="checkbox" th:field="*{roles}" th:value="${role}">
                    <span th:text="${role.label}">Perfil</span>
                </label>
                <p class="field-error" th:if="${#fields.hasErrors('roles')}" th:errors="*{roles}"></p>
            </fieldset>
            <label class="check-row"><input type="checkbox" th:field="*{enabled}"><span>Conta ativa</span></label>
            <div class="form-actions"><a class="button button-secondary" th:href="@{/admin/usuarios}">Cancelar</a><button class="button button-primary" type="submit">Salvar alteracoes</button></div>
        </form>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
