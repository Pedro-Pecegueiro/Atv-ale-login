<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Redefinir senha')}"></head>
<body>
<header th:replace="~{fragments/layout :: navigation}"></header>
<main class="auth-shell container">
    <section class="auth-card">
        <h1>Redefinir senha</h1>
        <form th:action="@{/senha/redefinir}" th:object="${passwordResetForm}" method="post" class="stacked-form" novalidate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" th:field="*{token}">
            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-error" role="alert">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
            </div>
            <label for="password">Nova senha</label>
            <input id="password" th:field="*{password}" type="password" autocomplete="new-password" maxlength="72" required>
            <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
            <label for="confirmPassword">Confirmar nova senha</label>
            <input id="confirmPassword" th:field="*{confirmPassword}" type="password" autocomplete="new-password" maxlength="72" required>
            <p class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
            <p class="password-hint">Minimo de 12 caracteres, com maiuscula, minuscula, numero e simbolo.</p>
            <button class="button button-primary button-block" type="submit">Salvar nova senha</button>
        </form>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
