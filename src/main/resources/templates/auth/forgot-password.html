<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Recuperar senha')}"></head>
<body>
<header th:replace="~{fragments/layout :: navigation}"></header>
<main class="auth-shell container">
    <section class="auth-card">
        <h1>Recuperar senha</h1>
        <p class="muted">Informe o e-mail da sua conta.</p>
        <div th:replace="~{fragments/layout :: messages}"></div>
        <a th:if="${resetUrl}" class="button button-primary button-block" th:href="${resetUrl}">Redefinir senha</a>
        <form th:action="@{/senha/esqueci}" th:object="${emailRequestForm}" method="post" class="stacked-form" novalidate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label for="email">E-mail</label>
            <input id="email" th:field="*{email}" type="email" autocomplete="email" maxlength="120" required>
            <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
            <button class="button button-primary button-block" type="submit">Enviar link</button>
        </form>
        <p class="form-footer"><a th:href="@{/login}">Voltar para o login</a></p>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
