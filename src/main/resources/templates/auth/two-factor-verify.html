<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Confirmar acesso')}"></head>
<body>
<header th:replace="~{fragments/layout :: navigation}"></header>
<main class="auth-shell container">
    <section class="auth-card">
        <span class="eyebrow">Verificacao em duas etapas</span>
        <h1>Confirmar acesso</h1>
        <p class="muted">Digite o codigo atual exibido no Google Authenticator.</p>
        <div th:replace="~{fragments/layout :: messages}"></div>
        <form th:action="@{/2fa/verificar}" method="post" class="stacked-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label for="code">Codigo de seis digitos</label>
            <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required autofocus>
            <button class="button button-primary button-block" type="submit">Confirmar</button>
        </form>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
