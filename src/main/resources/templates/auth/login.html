<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Entrar')}"></head>
<body>
<header th:replace="~{fragments/layout :: navigation}"></header>
<main class="auth-shell container">
    <section class="auth-card">
        <h1>Acesse sua conta</h1>
        <p class="muted">Use seu nome de usuario ou e-mail.</p>
        <div th:replace="~{fragments/layout :: messages}"></div>
        <div th:if="${param.error}" class="alert alert-error" role="alert">Credenciais inválidas.</div>
        <div th:if="${param.logout}" class="alert alert-success" role="status">Sessao encerrada com sucesso.</div>
        <form th:action="@{/login}" method="post" class="stacked-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label for="username">Usuario ou e-mail</label>
            <input id="username" name="username" type="text" autocomplete="username" maxlength="120" required autofocus>
            <label for="password">Senha</label>
            <input id="password" name="password" type="password" autocomplete="current-password" maxlength="72" required>
            <a class="password-recovery-link" th:href="@{/senha/esqueci}">Esqueci minha senha</a>
            <button class="button button-primary button-block" type="submit">Entrar</button>
        </form>
        <p class="form-footer">Ainda nao possui conta? <a th:href="@{/cadastro}">Criar conta</a>.</p>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
