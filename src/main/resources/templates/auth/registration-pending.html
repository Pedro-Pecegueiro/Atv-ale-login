<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Confirmar cadastro')}"></head>
<body>
<header th:replace="~{fragments/layout :: navigation}"></header>
<main class="auth-shell container">
    <section class="auth-card">
        <h1>Confirme seu cadastro</h1>
        <p class="muted">Use o link de confirmacao enviado para seu e-mail. O link expira em 24 horas.</p>
        <div th:replace="~{fragments/layout :: messages}"></div>
        <a th:if="${verificationUrl}" class="button button-primary button-block" th:href="${verificationUrl}">Confirmar cadastro</a>
        <form th:action="@{/cadastro/reenviar}" th:object="${emailRequestForm}" method="post" class="stacked-form" novalidate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label for="email">E-mail do cadastro</label>
            <input id="email" th:field="*{email}" type="email" autocomplete="email" maxlength="120" required>
            <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
            <button class="button button-secondary button-block" type="submit">Gerar novo link</button>
        </form>
        <p class="form-footer"><a th:href="@{/login}">Voltar para o login</a></p>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
