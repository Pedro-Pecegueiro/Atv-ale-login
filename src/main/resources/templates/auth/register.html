<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Criar conta')}"></head>
<body>
<header th:replace="~{fragments/layout :: navigation}"></header>
<main class="auth-shell container">
    <section class="auth-card auth-card-wide">
        <span class="eyebrow">Cadastro JurisHome</span>
        <h1>Crie sua conta</h1>
        <p class="muted">Novas contas recebem acesso de cliente. Permissoes profissionais sao concedidas por um administrador.</p>
        <form th:action="@{/cadastro}" th:object="${registrationForm}" method="post" class="stacked-form" novalidate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-error" role="alert">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
            </div>
            <label for="username">Nome de usuario</label>
            <input id="username" th:field="*{username}" autocomplete="username" maxlength="30" required>
            <p class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
            <label for="email">E-mail</label>
            <input id="email" th:field="*{email}" type="email" autocomplete="email" maxlength="120" required>
            <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
            <div class="form-columns">
                <div>
                    <label for="password">Senha</label>
                    <input id="password" th:field="*{password}" type="password" autocomplete="new-password" maxlength="72" required>
                    <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                </div>
                <div>
                    <label for="confirmPassword">Confirmar senha</label>
                    <input id="confirmPassword" th:field="*{confirmPassword}" type="password" autocomplete="new-password" maxlength="72" required>
                    <p class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
                </div>
            </div>
            <p class="password-hint">Minimo de 12 caracteres, com maiuscula, minuscula, numero e simbolo.</p>
            <button class="button button-primary button-block" type="submit">Cadastrar</button>
        </form>
        <p class="form-footer">Ja possui conta? <a th:href="@{/login}">Entre aqui</a>.</p>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
