<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title th:text="${title + ' | ' + appName}">JurisHome</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/themes/{theme}.css(theme=${themeName})}">
</head>
<body>
<header class="site-header" th:fragment="navigation">
    <nav class="container navigation" aria-label="Navegacao principal">
        <a class="brand" th:href="@{/}" th:text="${appName}">JurisHome</a>
        <div class="nav-links">
            <a sec:authorize="isAuthenticated()" th:href="@{/dashboard}" class="nav-link">Painel</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/usuarios}" class="nav-link">Usuarios</a>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="inline-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="button button-ghost">Sair</button>
            </form>
        </div>
    </nav>
</header>

<div th:fragment="messages" class="messages" aria-live="polite">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
</div>

<footer th:fragment="footer" class="site-footer">
    <div class="container footer-content">
        <span th:text="${appName}">JurisHome</span>
    </div>
</footer>
</body>
</html>
